<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <title>Super Bet Arena - Redirecting...</title>
    <script>
      // Single Page App redirect for Netlify / GitHub Pages / Vercel
      // Converts 404 path into hash route so React Router can render it
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/#' + pathname + search + hash);
    </script>
  </head>
  <body style="background: #020617; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    <div style="text-align: center;">
      <h2>กำลังนำท่านเข้าสู่สังเวียน Super Bet Arena...</h2>
      <p style="color: #94a3b8;">Redirecting...</p>
    </div>
  </body>
</html>
